name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # SourceLink wants the full history

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Set up miniconda (Linux — ML-KEM needs OpenSSL 3.5+)
        if: matrix.os == 'ubuntu-latest'
        uses: conda-incubator/setup-miniconda@v4
        with:
          auto-update-conda: false
          activate-environment: pq
          channels: conda-forge

      - name: Install OpenSSL 3.5+ from conda-forge
        if: matrix.os == 'ubuntu-latest'
        shell: bash -el {0}
        run: |
          conda install -y -n pq -c conda-forge "openssl>=3.5,<4"
          "$CONDA/envs/pq/bin/openssl" version
          echo "PQ_OPENSSL_LIB=$CONDA/envs/pq/lib" >> "$GITHUB_ENV"

      - name: Probe ML-KEM availability
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pqprobe && cd /tmp/pqprobe
          cat > pqprobe.cs <<'EOF'
          using System.Security.Cryptography;
          Console.WriteLine($"MLKem.IsSupported = {MLKem.IsSupported}");
          EOF
          LD_LIBRARY_PATH="$PQ_OPENSSL_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" dotnet run pqprobe.cs

      - name: Restore
        run: dotnet restore PostQuantum.DataProtection.slnx

      - name: Build (Release, all targets, zero warnings)
        run: dotnet build PostQuantum.DataProtection.slnx -c Release --no-restore

      # LD_LIBRARY_PATH points the runtime at the conda OpenSSL 3.5+ on Linux so the
      # ML-KEM tests actually execute rather than skipping. PQ_OPENSSL_LIB is only set
      # on the Linux leg; on Windows and macOS this expands to nothing and the runner's
      # native primitives are used.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if [[ -n "${PQ_OPENSSL_LIB:-}" ]]; then
            export LD_LIBRARY_PATH="$PQ_OPENSSL_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          fi
          dotnet test tests/PostQuantum.DataProtection.Tests/PostQuantum.DataProtection.Tests.csproj \
            -c Release --no-build --logger "console;verbosity=normal" | tee test-output.log

      # A PqcFact skip is correct where the primitive genuinely cannot exist, but a
      # silently-skipped crypto suite is indistinguishable from a passing one. Linux and
      # Windows are the PQ-required lanes: if anything skipped there, the ML-KEM paths
      # were not proven and the job must fail.
      - name: Require zero skipped tests on the PQ-required lanes
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          # This SDK prints an indented per-project summary ("     Passed: 108") and
          # omits the Skipped line entirely when nothing skipped -- not the older
          # one-line "Passed!  - Failed: 0, Skipped: 0, ...". Parse both shapes, and
          # require a Passed count so an empty or crashed run cannot pass silently.
          # `|| true` matters: with no skips there is no "Skipped:" line at all, so grep
          # exits 1, pipefail propagates it and set -e kills the step -- the gate would
          # fail exactly when it should pass.
          passed=$(grep -oE 'Passed:[[:space:]]*[0-9]+' test-output.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}' || true)
          skipped=$(grep -oE 'Skipped:[[:space:]]*[0-9]+' test-output.log | grep -oE '[0-9]+' | awk '{s+=$1} END {print s+0}' || true)
          echo "passed=$passed skipped=$skipped"
          if [[ "${passed:-0}" -eq 0 ]]; then
            echo "::error::No passing tests found in the log — the suite did not run."
            exit 1
          fi
          if [[ "${skipped:-0}" -ne 0 ]]; then
            echo "::error::$skipped test(s) skipped on a PQ-required lane — ML-KEM was unavailable to the runner."
            exit 1
          fi
          echo "PQ-required check passed: $passed passed, 0 skipped."

      - name: Test with coverage (Linux only)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          export LD_LIBRARY_PATH="$PQ_OPENSSL_LIB${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          rm -rf artifacts/coverage
          dotnet test tests/PostQuantum.DataProtection.Tests/PostQuantum.DataProtection.Tests.csproj \
            -c Release --no-build \
            --collect:"XPlat Code Coverage" \
            --settings coverlet.runsettings \
            --results-directory artifacts/coverage

      - name: Coverage gate (≥ 85% line, ≥ 75% branch)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          report=$(ls artifacts/coverage/*/coverage.cobertura.xml | head -1)
          echo "Coverage report: $report"
          line=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$report').getroot().get('line-rate'))")
          branch=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('$report').getroot().get('branch-rate'))")
          echo "line-rate=$line"
          echo "branch-rate=$branch"
          # On failure, name the least-covered classes. A bare percentage says the gate
          # tripped but not where to look, which is how coverage drifts quietly.
          python3 - "$report" <<'EOF'
          import sys, xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          line, branch = float(root.get("line-rate")), float(root.get("branch-rate"))
          line_min, branch_min = 0.85, 0.75
          ok = True
          for label, got, want in (("line", line, line_min), ("branch", branch, branch_min)):
              if got < want:
                  print(f"FAIL: {label} coverage {got:.2%} < {want:.0%}"); ok = False
              else:
                  print(f"OK:   {label} coverage {got:.2%} >= {want:.0%}")
          if not ok:
              rows = []
              for cls in root.iter("class"):
                  lines = cls.find("lines")
                  total = len(lines.findall("line")) if lines is not None else 0
                  if total:
                      rows.append((float(cls.get("line-rate")), total, cls.get("name")))
              rows.sort()
              print("\nLeast-covered classes (line%, lines, name):")
              for rate, total, name in rows[:15]:
                  print(f"  {rate:6.1%} {total:5d}  {name}")
          sys.exit(0 if ok else 1)
          EOF

      - name: Upload coverage report
        # always(): the gate above fails the job, and without this the coverage report --
        # the only artifact that explains why -- is never uploaded.
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: artifacts/coverage/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Pack (Linux only — packs are platform-independent)
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/PostQuantum.DataProtection/PostQuantum.DataProtection.csproj -c Release --no-build -o artifacts

      - name: Reproducible-build check — repack and assert SHA-256 match
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/repack
          # Repack from a clean intermediate so we exercise the deterministic build path, not the cache.
          dotnet build src/PostQuantum.DataProtection/PostQuantum.DataProtection.csproj -c Release --no-restore /p:ContinuousIntegrationBuild=true
          dotnet pack src/PostQuantum.DataProtection/PostQuantum.DataProtection.csproj -c Release --no-build -o artifacts/repack /p:ContinuousIntegrationBuild=true

          a=$(sha256sum artifacts/PostQuantum.DataProtection.*.nupkg | awk '{print $1}')
          b=$(sha256sum artifacts/repack/PostQuantum.DataProtection.*.nupkg | awk '{print $1}')
          echo "first  pack sha256: $a"
          echo "second pack sha256: $b"
          if [ "$a" != "$b" ]; then
            echo "FAIL: .nupkg is not reproducible — same source produced different bytes."
            echo "      (This usually means a non-deterministic timestamp, embedded path, or transient ID slipped in.)"
            exit 1
          fi
          echo "OK: .nupkg is byte-identical across two independent packs."

      - name: Upload .nupkg / .snupkg
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: artifacts/*.*nupkg
          if-no-files-found: error
